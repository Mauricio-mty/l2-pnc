spring:
  application:
    name: exercise

  datasource:
    url: jdbc:postgresql://localhost:5432/STUDENT_BD
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ← Ahora al mismo nivel que jpa, no dentro de él
  sql:
    init:
      mode: always
      continue-on-error: true
